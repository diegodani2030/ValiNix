name: Deploy a InfinityFree

# Sube el sitio por FTP a InfinityFree cada vez que hay cambios en main.
# También se puede lanzar a mano desde la pestaña "Actions" de GitHub.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-infinityfree
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Revisar sintaxis PHP
        run: for f in $(find . -name '*.php' -not -path './.git/*'); do php -l "$f"; done

      - name: Subir por FTP a htdocs
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: /htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
